<div class="contact-detail" style="border:1px solid #ccc; padding:20px; margin-top:20px; width:400px;">
  
  <h3>{{ 'contactDetails' | transloco }}</h3>

  <mat-form-field appearance="outline" style="width:100%; margin-bottom:10px;">
    <mat-label>{{ 'name' | transloco }}</mat-label>
    <input matInput [(ngModel)]="contact.name">
  </mat-form-field>

  <mat-form-field appearance="outline" style="width:100%; margin-bottom:10px;">
    <mat-label>{{ 'email' | transloco }}</mat-label>
    <input matInput [(ngModel)]="contact.email">
  </mat-form-field>

  <mat-form-field appearance="outline" style="width:100%; margin-bottom:10px;">
    <mat-label>{{ 'phone' | transloco }}</mat-label>
    <input matInput [(ngModel)]="contact.phone">
  </mat-form-field>

  <div style="display:flex; gap:10px; margin-top:10px;">
    <button mat-stroked-button color="accent" (click)="onEdit()">
      {{ 'save' | transloco }}
    </button>

    <button mat-stroked-button color="warn" (click)="onDelete()">
      {{ 'delete' | transloco }}
    </button>

    <button mat-stroked-button (click)="onClose()">
      {{ 'close' | transloco }}
    </button>
  </div>

</div>
