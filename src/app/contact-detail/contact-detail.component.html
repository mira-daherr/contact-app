<div class="contact-detail" style="border:1px solid #ccc; padding:20px; margin-top:20px; width:400px;">
  <h3>Contact Details</h3>


  <mat-form-field appearance="outline" style="width:100%; margin-bottom:10px;">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="contact.name">
  </mat-form-field>


  <mat-form-field appearance="outline" style="width:100%; margin-bottom:10px;">
    <mat-label>Email</mat-label>
    <input matInput [(ngModel)]="contact.email">
  </mat-form-field>

  <mat-form-field appearance="outline" style="width:100%; margin-bottom:10px;">
    <mat-label>Phone</mat-label>
    <input matInput [(ngModel)]="contact.phone">
  </mat-form-field>


  <div style="display:flex; gap:10px; margin-top:10px;">
    <button mat-stroked-button color="accent" (click)="onEdit()">Save</button>
    <button mat-stroked-button color="warn" (click)="onDelete()">Delete</button>
    <button mat-stroked-button (click)="onClose()">Close</button>
  </div>
</div>
