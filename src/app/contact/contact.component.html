<div style="margin: 20px;">
  <h2>Add Contact</h2>
  <mat-form-field appearance="outline" style="margin-right:10px;">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="newContact.name">
  </mat-form-field>

  <mat-form-field appearance="outline" style="margin-right:10px;">
    <mat-label>Email</mat-label>
    <input matInput [(ngModel)]="newContact.email">
  </mat-form-field>

  <mat-form-field appearance="outline" style="margin-right:10px;">
    <mat-label>Phone</mat-label>
    <input matInput [(ngModel)]="newContact.phone">
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="addContact()">Add</button>

  <hr style="margin:20px 0;">

  <mat-form-field appearance="outline" style="width:300px;">
    <mat-label>Search</mat-label>
    <input matInput [(ngModel)]="searchTerm">
  </mat-form-field>

  <table mat-table [dataSource]="contacts | filterContacts:searchTerm" class="mat-elevation-z8" style="width:100%; margin-top:20px;">

  
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let contact"> {{contact.id}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let contact">
        <ng-container *ngIf="editingContact && editingContact.id === contact.id; else viewName">
          <input matInput [(ngModel)]="editingContact.name">
        </ng-container>
        <ng-template #viewName>
          {{contact.name}}
        </ng-template>
      </td>
    </ng-container>


    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let contact">
        <ng-container *ngIf="editingContact && editingContact.id === contact.id; else viewEmail">
          <input matInput [(ngModel)]="editingContact.email">
        </ng-container>
        <ng-template #viewEmail>
          {{contact.email}}
        </ng-template>
      </td>
    </ng-container>


    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef> Phone </th>
      <td mat-cell *matCellDef="let contact">
        <ng-container *ngIf="editingContact && editingContact.id === contact.id; else viewPhone">
          <input matInput [(ngModel)]="editingContact.phone">
        </ng-container>
        <ng-template #viewPhone>
          {{contact.phone}}
        </ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let contact">
        <button *ngIf="!editingContact || editingContact.id !== contact.id" mat-button color="primary" (click)="startEdit(contact)">Edit</button>
        <button *ngIf="editingContact && editingContact.id === contact.id" mat-button color="accent" (click)="saveEdit()">Save</button>
        <button *ngIf="editingContact && editingContact.id === contact.id" mat-button color="warn" (click)="cancelEdit()">Cancel</button>
        <button mat-button color="warn" (click)="deleteContact(contact.id)">Delete</button>
      </td>
    </ng-container>

   
    <tr mat-header-row *matHeaderRowDef="['id','name','email','phone','actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id','name','email','phone','actions'];"></tr>
  </table>
</div>
