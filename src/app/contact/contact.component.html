<div style="margin: 20px;">
  <h2>Add Contact</h2>
  <mat-form-field appearance="outline" style="margin-right:10px;"><!--outline:with an outlined border-->
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="newContact.name">
  </mat-form-field>

  <mat-form-field appearance="outline" style="margin-right:10px;">
    <mat-label>Email</mat-label>
    <input matInput [(ngModel)]="newContact.email">
  </mat-form-field>

  <mat-form-field appearance="outline" style="margin-right:10px;">
    <mat-label>Phone</mat-label>
    <input matInput [(ngModel)]="newContact.phone">
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="addContact()">Add</button>

  <hr style="margin:20px 0;">

  <mat-form-field appearance="outline" style="width:300px;">
    <mat-label>Search</mat-label>
    <input matInput [(ngModel)]="searchTerm" (input)="searchContact()">
  </mat-form-field>

  <table mat-table [dataSource]="contacts" class="mat-elevation-z8" style="width:100%; margin-top:20px;">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let contact"> {{contact.id}} </td>
    </ng-container>

  
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let contact">
        <span *ngIf="editingContact?.id !== contact.id">{{contact.name}}</span>
        <input *ngIf="editingContact?.id === contact.id" [(ngModel)]="editingContact!.name">
      </td>
    </ng-container>

   
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let contact">
        <span *ngIf="editingContact?.id !== contact.id">{{contact.email}}</span>
        <input *ngIf="editingContact?.id === contact.id" [(ngModel)]="editingContact!.email">
      </td>
    </ng-container>

 
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef> Phone </th>
      <td mat-cell *matCellDef="let contact">
        <span *ngIf="editingContact?.id !== contact.id">{{contact.phone}}</span>
        <input *ngIf="editingContact?.id === contact.id" [(ngModel)]="editingContact!.phone">
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let contact">
     <button *ngIf="editingContact?.id !== contact.id" mat-button color="primary" (click)="startEdit(contact)">Edit</button>
<button *ngIf="editingContact?.id === contact.id" mat-button color="accent" (click)="saveEdit()">Save</button>
<button *ngIf="editingContact?.id === contact.id" mat-button color="warn" (click)="cancelEdit()">Cancel</button>

        <button mat-button color="warn" (click)="deleteContact(contact.id)">Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id','name','email','phone','actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id','name','email','phone','actions'];"></tr>
  </table>
</div>
