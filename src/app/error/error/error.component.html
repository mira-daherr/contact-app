<mat-card>
  <mat-card-header>
    <mat-card-title>{{ 'errorTitle' | transloco }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p>{{ 'errorMessage' | transloco }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="warn" routerLink="/auth/register">
      {{ 'backToRegister' | transloco }}
    </button>
  </mat-card-actions>
</mat-card>
