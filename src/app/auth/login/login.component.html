<div
  style="width: 300px; margin: 50px auto; text-align: center; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">

  <p>{{ 'loginWorks' | transloco }}</p>

  <h2>{{ 'login' | transloco }}</h2>

  <input type="email" [(ngModel)]="email" placeholder="{{ 'email' | transloco }}"
    style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;">

  <input type="password" [(ngModel)]="password" placeholder="{{ 'password' | transloco }}"
    style="width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc;">

  <button (click)="login()"
    style="width: 100%; padding: 10px; border: none; border-radius: 4px; background-color: #3f51b5; color: white; font-weight: bold;">
    {{ 'login' | transloco }}
  </button>

  <p>
    {{ 'dontHaveAccount' | transloco }}
    <a routerLink="/auth/register">{{ 'signupHere' | transloco }}</a>
  </p>

</div>
